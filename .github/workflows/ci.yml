name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Snapshots
        run: |
          shopt -s nullglob
          mkdir -p snapshots
          ELSEWHEN_SNAPSHOT_DIR="$PWD/snapshots" build/Elsewhen.app/Contents/MacOS/Elsewhen
          ls -l snapshots
          # Printed too, small, so they can be read from the log without downloading anything.
          for f in snapshots/*.png; do
            sips -s format jpeg -s formatOptions 40 "$f" --out "${f%.png}.jpg" >/dev/null
            echo "SNAPSHOT ${f%.png}.jpg $(base64 -i "${f%.png}.jpg" | tr -d '\n')"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhen
          path: build/Elsewhen.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore
