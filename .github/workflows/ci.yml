name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Snapshots
        run: |
          shopt -s nullglob
          mkdir -p snapshots
          ELSEWHEN_SNAPSHOT_DIR="$PWD/snapshots" build/Elsewhen.app/Contents/MacOS/Elsewhen
          ls -l snapshots
          # Printed too, so they can be read from the log without downloading anything.
          for f in snapshots/*.png; do echo "SNAPSHOT $f"; base64 -i "$f" | tr -d '\n'; echo; echo "END SNAPSHOT"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhen
          path: build/Elsewhen.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore
