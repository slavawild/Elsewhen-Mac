name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Test
        run: SNAPSHOT_OUT="$PWD/snapshots" swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Snapshots
        if: always()
        run: |
          shopt -s nullglob
          ls -l snapshots || true
          # Printed so they can be read from the log without downloading anything:
          # renders as small JPEGs, and references still to be recorded as they are.
          for f in snapshots/*.png; do
            case "$(basename "$f")" in
              new-*) echo "REFERENCE $(basename "$f" | sed 's/^new-//') $(base64 -i "$f" | tr -d '\n')" ;;
              *)
                sips -s format jpeg -s formatOptions 40 "$f" --out "${f%.png}.jpg" >/dev/null
                echo "SNAPSHOT $(basename "${f%.png}").jpg $(base64 -i "${f%.png}.jpg" | tr -d '\n')" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Elsewhen
          path: build/Elsewhen.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: ignore
